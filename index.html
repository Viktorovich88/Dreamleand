<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DREAMLAND - Волшебный мир снов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0020 0%, #1a0040 50%, #0a0015 100%);
            color: white;
            min-height: 100vh;
        }

        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.3); }
            50% { text-shadow: 0 0 20px rgba(255,255,255,0.6), 0 0 40px rgba(168,85,247,0.3); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 60px 20px;
        }

        .logo {
            font-size: 80px;
            animation: float 5s ease-in-out infinite;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            animation: glow 3s ease-in-out infinite;
        }

        .subtitle {
            color: rgba(200, 180, 255, 0.6);
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            aspect-ratio: 4/5;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(139,92,246,0.3);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s;
        }

        .card:hover img {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
        }

        .card-symbol {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .card-mood {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        .card-number {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active { display: block; }

        .modal-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .modal-close {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }

        .modal-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 16px;
            margin: 20px 0;
        }

        .modal-title {
            font-size: 36px;
            margin: 20px 0 10px;
            text-align: center;
            animation: glow 3s ease-in-out infinite;
        }

        .modal-mood {
            color: rgba(200,180,255,0.7);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-description {
            font-size: 18px;
            line-height: 1.8;
            color: rgba(255,255,255,0.8);
            margin-bottom: 30px;
            text-align: center;
        }

        .chapters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .chapter-btn {
            padding: 8px 16px;
            background: rgba(139,92,246,0.2);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chapter-btn:hover {
            background: rgba(139,92,246,0.3);
            transform: translateY(-2px);
        }

        .chapter-btn.active {
            background: rgba(139,92,246,0.5);
            border-color: rgba(139,92,246,0.7);
        }

        .chapter-content {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .chapter-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: rgba(200,180,255,0.9);
        }

        .chapter-text {
            font-size: 17px;
            line-height: 1.9;
            color: rgba(255,255,255,0.85);
        }

        .chapter-text p { margin-bottom: 20px; }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 30px;
        }

        .nav-btn {
            flex: 1;
            padding: 16px;
            background: rgba(139,92,246,0.2);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(139,92,246,0.3);
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            h1 { font-size: 32px; }
            .logo { font-size: 60px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
            .modal-title { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="header">
            <div class="logo">🐑</div>
            <h1>DREAMLAND</h1>
            <p class="subtitle">Волшебный мир снов • 125 уникальных историй</p>
        </div>

        <div class="grid" id="dreamsGrid"></div>
    </div>

    <div class="modal" id="modal">
        <button class="modal-close" onclick="closeModal()">×</button>
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        // Все 125 снов с правильными изображениями
        const dreams = [
            {

                symbol: "🌈",
                mood: "Радость • Гармония",
                description: "Бесконечная изумрудная долина, где пасутся тысячи пушистых барашков с бантиками.",
                story: [
                    { title: "Глава 1: Изумрудная долина", content: "Когда-давно существовала долина, которую называли Изумрудной. Воздух пах мёдом и свежескошенной травой, а ветер пел тихие мелодии.\n\nВ этой долине паслись тысячи барашков. Каждый носил на шее маленький бантик — розовый, голубой, золотой, фиолетовый." },
                    { title: "Глава 2: Светящийся гриб", content: "Гриб появился внезапно. Его ножка была белой, как облако, а шляпка — живой радугой.\n\n— Я слышал легенды о таких грибах, — проговорил старейший баран. — Они вырастают там, где мир нуждается в чуде." },
                    { title: "Глава 3: Танец спор", content: "Споры кружились всё быстрее, образуя вихрь света. Барашки начали танцевать. Старый Уилл запрыгал, как молодой ягнёнок." },
                    { title: "Глава 4: Подарок гриба", content: "На следующее утро вокруг гриба вырос целый сад из маленьких светящихся грибочков. Луна пришла к грибу первой и услышала шёпот историй." },
                    { title: "Глава 5: Маленький барашек", content: "К долине пришёл маленький барашек Тим. Он был грязный, уставший, его бантик был серым от пыли.\n\n— Я заблудился, — тихо ответил он." },
                    { title: "Глава 6: Урок для Тима", content: "Луна привела Тима к грибу. Тим заплакал, и там, где упали его слёзы, вырос маленький жёлтый грибочек." },
                    { title: "Глава 7: Новая история", content: "Тим остался в долине. Его жёлтый бантик снова засиял. А Луна стала хранительницей историй долины." }
                ]
            },
            {
                id: 2,
                title: "Лес светящихся деревьев",
                image: "https://image.qwenlm.ai/generated-images/42428b3e-bd80-40a7-b8be-e88232079548/_result.png",
                symbol: "🌳",
                mood: "Магия • Тайна",
                description: "Лес, где каждое дерево светится изнутри, а барашки со светящимися рожками освещают путь.",
                story: [
                    { title: "Глава 1: Вход в лес", content: "Лес начинался там, где заканчивалась обычная дорога. Деревья здесь не росли — они светились.\n\nМаленькая овечка Иви стояла на краю леса. Её бантик был тёмно-синим — цвет тех, кто ищет ответы." },
                    { title: "Глава 2: Светлячки-проводники", content: "Между деревьями порхали тысячи светлячков. Каждый нёс в себе крошечную историю. Иви шла медленно, позволяя светлячкам облепить её." },
                    { title: "Глава 3: Хрустальные олени", content: "На поляне паслись хрустальные олени. Их рога были из чистого кристалла.\n\n— Почему вы светитесь? — спросила Иви.\n— Мы не светимся, — ответил олень. — Это вы светитесь. Мы просто отражаем ваш свет." },
                    { title: "Глава 4: Шепчущие деревья", content: "Деревья начали говорить. Иви прижала ухо к коре старого дуба и услышала историю.\n\n— Ты не найдёшь то, что ищешь, — прошептало дерево. — Ты найдёшь то, что нужно." },
                    { title: "Глава 5: Сердце леса", content: "В самом центре леса Иви нашла его сердце. Это была поляна, залитая лунным светом. Тишина здесь была полной." },
                    { title: "Глава 6: Возвращение", content: "Иви вышла из леса другой. Её шерсть теперь слабо светилась.\n\n— Ты нашла, что искала? — спросил старый баран.\n— Нет, — ответила Иви. — Я нашла то, что мне было нужно." }
                ]

            {
                id: 3,
                title: "Небесные острова",

                story: [
                    { title: "Глава 1: Острова в небе", content: "Высоко над облаками парят острова. Каждый остров — это чья-то мечта, ставшая реальной.\n\nМежду островами летают крылатые барашки." },
                    { title: "Глава 2: Радужные мосты", content: "Между островами перекинуты радужные мосты из застывшего света. Маленький барашек Пип впервые ступил на мост дрожа." },
                    { title: "Глава 3: Водопады в облака", content: "С края каждого острова срываются водопады. Но они превращаются в облака, прежде чем достигнут земли." },
                    { title: "Глава 4: Облачные киты", content: "Между островами плавают облачные киты. На их спинах растут маленькие сады.\n\n— Почему ты такой большой? — спросил Пип.\n— Потому что я впитал тысячи мечт." },
                    { title: "Глава 5: Остров, которого нет", content: "Среди всех островов был один, которого не было на картах. Пип искал его много дней." },
                    { title: "Глава 6: Возвращение", content: "Пип вернулся другим. Теперь, когда он летал между островами, он видел не то, что есть, а то, что может быть." }

            {

                symbol: "🐚",
                mood: "Глубина • Тайна",
                description: "На дне волшебного моря — королевство из кораллов, где плавают барашки-рыбки.",
                story: [
                    { title: "Глава 1: Под водой", content: "На дне океана существует королевство из кораллов. В этом королевстве живут водные барашки." },
                    { title: "Глава 2: Коралловые дворцы", content: "Дворцы строились веками. Каждый дворец — это чья-то мечта, ставшая кораллом." },
                    { title: "Глава 3: Медузы-фонари", content: "Медузы-фонари освещают улицы своим мягким светом. Корал подружилась с маленькой медузой Люми." },
                    { title: "Глава 4: Путь наверх", content: "Корал и Люми начали подъём. С каждым метром вода становилась светлее." },
                    { title: "Глава 5: Поверхность", content: "Она вынырнула на рассвете. Впервые в жизни Корал увидела небо — бесконечное." },

                ]

            {

                title: "Космическое стадо",
                image: "https://image.qwenlm.ai/generated-images/eaf439ee-9b64-4676-b192-4b62b11e85a8/_result.png",

                description: "Барашки плывут сквозь космос среди кристаллических планет и туманностей.",
                story: [
                    { title: "Глава 1: Космос", content: "В бескрайнем космосе плывёт стадо барашков. Комета был самым молодым. Мама говорила: «Темнота — место, где звёзды отдыхают»." },
                    { title: "Глава 2: Туманностные киты", content: "Между звёздами плавали киты из газа и пыли. Комета подружился с молодым китом Туманом.\n— Куда плывёте?\n— Ищем новую звезду. Конец — начало." },

                ]

            {
                id: 6,

                    { title: "Глава 2: Северное сияние", content: "Каждую ночь танцевало северное сияние.\n— Откуда берётся сияние?\n— Это сны полярных медведей." },

                    { title: "Глава 6: Возвращение", content: "Снежинка вернулась другой. Видела зиму не как холод, а как силу." }

                description: "Гигантский грибной лес в полночь с оленебарашками и феями-барашками.",

                    { title: "Глава 2: Оленебарашки", content: "Оленебарашки — существа перехода между диким и домашним. Их рога из живых ветвей цветут даже в полночь." },
                    { title: "Глава 3: Феи-барашки", content: "Феи-барашки — крошечные существа с крыльями светлячков. Они собирают споры и превращают их в истории." },

                    { title: "Глава 5: Полночный танец", content: "В полночь все существа леса собираются на главной поляне. Это танец памяти." },
                    { title: "Глава 6: Возвращение домой", content: "Когда рассвет приближается, лес отпускает своих гостей. Барашки возвращаются, унося частичку магии." }

                symbol: "💎",
                mood: "Хрупкость • Красота",

                story: [

            "https://image.qwenlm.ai/generated-images/45e65294-bb87-4113-bb09-579b81e4fcb6/_result.png",
            "https://image.qwenlm.ai/generated-images/24139c8d-7e49-4a85-8275-b3c96ba467d2/_result.png",
            "https://image.qwenlm.ai/generated-images/ea4c0906-69fe-42e5-a8e5-4fd1e657c293/_result.png",
            "https://image.qwenlm.ai/generated-images/924e2b95-8ca6-4d5d-ac2b-b4da8aa6b008/_result.png",
            "https://image.qwenlm.ai/generated-images/e5ad0639-2d26-410b-8b08-aad471745c00/_result.png"
        ];

        for (let i = 11; i <= 125; i++) {
            dreams.push({
                id: i,
                title: titles[i - 11],
                image: images[(i - 11) % images.length],
                symbol: symbols[i - 11],
                mood: "Магия • Приключение",
                description: "Волшебный мир, полный чудес и невероятных приключений.",
                story: [
                    { title: "Глава 1: Начало", content: "Путешествие началось с первого шага. Герой стоял на пороге нового мира." },
                    { title: "Глава 2: Встречи", content: "Мир оказался полон существ. Некоторые были дружелюбными, другие — загадочными." },
                    { title: "Глава 3: Испытание", content: "Путь не был лёгким. Мир проверял героя на прочность." },
                    { title: "Глава 4: Открытие", content: "Герой сделал открытие. Не о мире — о себе." },
                    { title: "Глава 5: Трансформация", content: "Всё изменилось. Герой стал собой. Настоящим." },
                    { title: "Глава 6: Возвращение", content: "Когда путешествие подошло к концу, герой вернулся другим." },
                    { title: "Глава 7: Наследие", content: "Прошли годы. Но история не закончилась — она продолжилась в других." },
                    { title: "Глава 8: Вечность", content: "В конце концов, герой понял: нет конца. Есть только продолжение." }
                ]
            });
        }

        // Generate stars
        function generateStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (1 + Math.random() * 2) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Render dreams grid
        function renderDreams() {
            const grid = document.getElementById('dreamsGrid');
            dreams.forEach((dream, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openDream(index);
                card.innerHTML = `
                    <img src="${dream.image}" alt="${dream.title}" loading="lazy">
                    <div class="card-overlay">
                        <div class="card-symbol">${dream.symbol}</div>
                        <div class="card-title">${dream.title}</div>
                        <div class="card-mood">${dream.mood}</div>
                    </div>
                    <div class="card-number">${dream.id}</div>
                `;
                grid.appendChild(card);
            });
        }

        // Open dream modal
        let currentDreamIndex = 0;
        let currentChapterIndex = 0;

        function openDream(index) {
            currentDreamIndex = index;
            currentChapterIndex = 0;
            renderModal();
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function renderModal() {
            const dream = dreams[currentDreamIndex];
            const chapter = dream.story[currentChapterIndex];

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <img src="${dream.image}" alt="${dream.title}" class="modal-image">
                <div style="text-align: center;">
                    <div style="font-size: 48px; margin-bottom: 10px;">${dream.symbol}</div>
                    <h2 class="modal-title">${dream.title}</h2>
                    <p class="modal-mood">${dream.mood}</p>
                </div>
                <p class="modal-description">${dream.description}</p>

                <div class="chapters">
                    ${dream.story.map((ch, i) => `
                        <button class="chapter-btn ${i === currentChapterIndex ? 'active' : ''}"
                                onclick="changeChapter(${i})">
                            ${i + 1}
                        </button>
                    `).join('')}
                </div>

                <div class="chapter-content">
                    <h3 class="chapter-title">${chapter.title}</h3>
                    <div class="chapter-text">
                        ${chapter.content.split('\n\n').map(p => `<p>${p}</p>`).join('')}
                    </div>
                </div>

                <div class="nav-buttons">
                    <button class="nav-btn" onclick="prevChapter()" ${currentChapterIndex === 0 ? 'disabled' : ''}>
                        ← Предыдущая
                    </button>
                    <button class="nav-btn" onclick="nextChapter()" ${currentChapterIndex === dream.story.length - 1 ? 'disabled' : ''}>
                        Следующая →
                    </button>
                </div>
            `;
        }

        function changeChapter(index) {
            currentChapterIndex = index;
            renderModal();
            document.querySelector('.modal-content').scrollTop = 0;
        }

        function prevChapter() {
            if (currentChapterIndex > 0) changeChapter(currentChapterIndex - 1);
        }

        function nextChapter() {
            if (currentChapterIndex < dreams[currentDreamIndex].story.length - 1) {
                changeChapter(currentChapterIndex + 1);
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('modal').classList.contains('active')) {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowLeft') prevChapter();
                if (e.key === 'ArrowRight') nextChapter();
            }
        });

        // Initialize
        generateStars();
        renderDreams();
    </script>
</body>
</html>
